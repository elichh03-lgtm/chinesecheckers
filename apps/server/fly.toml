app = "cc-server"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3001"
  NODE_ENV = "production"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  # MVP: single instance — in-process game state isn't yet Redis-backed (see DEPLOY.md).
  max_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    timeout = "2s"
    path = "/api/v1/health"

[deploy]
  strategy = "rolling"
  wait_timeout = "5m"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
